<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Participación en vivo · Gobierno de La Pampa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --fondo:#0E1626; --sup:#18233A; --sup2:#212E4A; --borde:#2E3D5C;
  --tinta:#F3F0E7; --tenue:#8896B0; --senal:#FFC53D; --aire:#93AEFF;
  --verde:#35C46B; --amarillo:#FFC53D; --rojo:#FF5C5C; --alerta:#FF7A59;
  --display:'Bricolage Grotesque','Arial Black',sans-serif;
  --cuerpo:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--fondo);color:var(--tinta);font-family:var(--cuerpo);
  -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--senal);outline-offset:2px}
textarea,input{font-family:inherit}
.oculto{display:none !important}

.etiqueta{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--tenue)}
.envoltorio{max-width:620px;margin:0 auto;padding:26px 20px 44px}

/* ── Botones ── */
.btn{padding:14px 20px;border-radius:10px;font-size:15px;font-weight:600;
  background:var(--senal);color:#22190A;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:default;transform:none}
.btn-f{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 1px var(--borde)}
.btn-r{background:transparent;color:var(--alerta);box-shadow:inset 0 0 0 1px var(--alerta)}
.btn-ancho{width:100%}

/* ── Participante ── */
.pregunta{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;
  letter-spacing:-.015em;margin:14px 0 8px}
.ayuda{font-size:14px;color:var(--tenue);margin:0 0 22px;line-height:1.45}
.opcion{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:var(--sup);border-radius:12px;padding:16px 18px;margin-bottom:10px;
  box-shadow:inset 0 0 0 1px var(--borde);font-size:16px;line-height:1.4}
.opcion:active{background:var(--sup2)}
.letra{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--senal);
  background:rgba(255,197,61,.12);border-radius:6px;min-width:28px;height:28px;
  display:grid;place-items:center;flex:none;margin-top:1px}
.item-fila{background:var(--sup);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  box-shadow:inset 0 0 0 1px var(--borde)}
.item-txt{font-size:15px;line-height:1.35;margin-bottom:12px}
.semaforo{display:flex;gap:8px}
.sem-btn{flex:1;padding:12px 6px;border-radius:9px;background:var(--sup2);
  font-size:13px;font-weight:600;color:var(--tenue);
  box-shadow:inset 0 0 0 1px transparent;transition:all .15s ease}
.sem-btn .punto{display:block;width:13px;height:13px;border-radius:50%;margin:0 auto 6px;opacity:.35}
.sem-btn[aria-pressed="true"]{background:var(--sup);color:var(--tinta)}
.sem-btn[aria-pressed="true"] .punto{opacity:1}
.escritura{width:100%;background:var(--sup);color:var(--tinta);font-size:17px;line-height:1.45;
  padding:16px;border-radius:12px;border:1px solid var(--borde);resize:none}
.contador{font-family:var(--mono);font-size:12px;color:var(--tenue);text-align:right;margin:6px 0 16px}
.centrado{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px 24px}
.aviso{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(255,122,89,.12);
  color:var(--alerta);font-size:14px}
.barra-fija{position:sticky;bottom:0;background:linear-gradient(transparent,var(--fondo) 28%);
  padding:22px 0 6px;margin-top:8px}

/* ── Presentador ── */
.escena{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.escena-cuerpo{flex:1;padding:30px 40px 16px;display:flex;flex-direction:column;min-height:0}
.titulo-grande{font-family:var(--display);font-weight:800;letter-spacing:-.025em;
  font-size:clamp(26px,3.6vw,52px);line-height:1.05;margin:14px 0 26px;max-width:26ch}
.resultados{flex:1;min-height:0;overflow:auto}
.fila-barra{margin-bottom:13px}
.fila-cab{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:5px}
.fila-txt{font-size:clamp(14px,1.35vw,20px);line-height:1.3}
.fila-num{font-family:var(--mono);font-size:clamp(13px,1.2vw,18px);color:var(--tenue);flex:none}
.pista{height:12px;background:var(--sup2);border-radius:6px;overflow:hidden;display:flex}
.relleno{height:100%;background:var(--aire);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.relleno.lider{background:var(--senal)}
.tira{display:flex;flex-wrap:wrap;gap:4px;align-items:center;max-height:56px;overflow:hidden}
.cuadro{width:11px;height:11px;border-radius:2px;background:var(--senal);animation:pop .3s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.nube{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;justify-content:center}
.nube span{font-family:var(--display);line-height:1.1;animation:sube .35s ease both}
.nube-centro{height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:6px 0}
.nube-lider{text-align:center;padding:6px 0}
.nube-lider span{display:block;font-family:var(--display);font-weight:800;letter-spacing:-.03em;
  font-size:clamp(46px,8.5vw,124px);line-height:1;color:var(--senal);animation:sube .4s ease both}
.nube-cnt{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tenue);margin-top:8px}
.seg{display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;font-weight:600;
  color:#121B2C;overflow:hidden;white-space:nowrap}
.tapado{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:14px}
.tapado .marco{width:64px;height:64px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--borde);
  display:grid;place-items:center}
.tapado .marco b{width:22px;height:3px;background:var(--tenue);border-radius:2px;display:block}
.tapado h3{font-family:var(--display);font-weight:800;font-size:26px;margin:0}
.tapado p{color:var(--tenue);font-size:15px;margin:0;max-width:340px;line-height:1.5}
@keyframes sube{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start}
.tarjeta{background:var(--sup2);border-left:3px solid var(--borde);border-radius:0 8px 8px 0;
  padding:13px 15px;font-size:15px;line-height:1.45}
.tarjeta.nueva{border-left-color:var(--senal)}
.consola{background:var(--sup);border-top:1px solid var(--borde)}
.consola-int{padding:0 20px 18px}
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tab{background:var(--sup2);font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:8px;
  display:flex;align-items:center;gap:7px;max-width:260px}
.tab.activo{background:var(--senal);color:#22190A}
.tab .nom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .cnt{font-family:var(--mono);font-size:11px;opacity:.75}
.acciones{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.acciones .btn{padding:11px 16px;font-size:14px}
.leyenda{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.leyenda span{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tenue)}
.leyenda i{width:12px;height:12px;border-radius:3px;display:block}
.pulso{animation:pulso 2.2s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:700px){.escena-cuerpo{padding:22px 18px 12px}}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. CONFIGURACIÓN — completá estos tres valores
   ═══════════════════════════════════════════════════════════════ */

const SUPABASE_URL = "https://tofbrbtyokqczjjrdzoo.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvZmJyYnR5b2txY3pqanJkem9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTMzNDMsImV4cCI6MjEwMjYyOTM0M30.GCzE8q7EV4Rz9TjmaB5zs8DpRObVRsWEnr4PK2zdfiU";

// La clave del presentador NO va acá: se tipea al entrar a #presenta
// y tiene que coincidir con la que pusiste en supabase.sql

/* ═══════════════════════════════════════════════════════════════
   2. PREGUNTAS
   ═══════════════════════════════════════════════════════════════ */

const PREGUNTAS = [
  {
    id: "p1",
    tipo: "nube",
    titulo: "El nuevo escenario para la agricultura y la ganadería",
    texto: "¿Qué palabra asocia con este nuevo escenario?",
    ayuda: "Una sola palabra.",
    limite: 24
  },
  {
    id: "p2",
    tipo: "opcion",
    texto: "¿Con cuál de las siguientes situaciones se identifica hoy su empresa agropecuaria?",
    opciones: [
      { letra: "A", texto: "No nos interesa avanzar, por el momento, hacia este tipo de iniciativas." },
      { letra: "B", texto: "Nos interesa incorporar prácticas de agricultura o ganadería regenerativa para mejorar el sistema productivo, sin pensar por ahora en certificaciones." },
      { letra: "C", texto: "Nos interesa avanzar hacia certificaciones o esquemas de diferenciación (por ejemplo, regeneración, carne de pastizal, otras)." },
      { letra: "D", texto: "Calcular la huella de carbono de nuestros productos para responder a las demandas del mercado e identificar oportunidades para reducir las emisiones." },
      { letra: "E", texto: "Nos interesa evaluar la posibilidad de desarrollar un proyecto de carbono y conocer los requisitos." },
      { letra: "F", texto: "Ya estamos implementando acciones o participando en alguna de estas iniciativas." }
    ]
  },
  {
    id: "p3",
    tipo: "semaforo",
    texto: "Situación del sector agropecuario pampeano: ¿cómo creen que está hoy el sector?",
    ayuda: "Marque un color para cada aspecto.",
    escala: [
      { valor: "Bien",       color: "var(--verde)" },
      { valor: "Intermedio", color: "var(--amarillo)" },
      { valor: "Débil",      color: "var(--rojo)" }
    ],
    items: [
      { id: "a", texto: "Conocimiento del mercado de carbono" },
      { id: "b", texto: "Disponibilidad de información técnica" },
      { id: "c", texto: "Capacidad de medición" },
      { id: "d", texto: "Acceso a certificación" },
      { id: "e", texto: "Acceso a financiamiento" },
      { id: "f", texto: "Respuesta a los requisitos ambientales de mercados internacionales" }
    ]
  },
  {
    id: "p4",
    tipo: "semaforo",
    texto: "¿Qué acciones debería priorizar la Provincia para acompañar a las empresas agropecuarias?",
    ayuda: "Prácticas regenerativas, certificaciones o mercados de carbono. Asigne una prioridad a cada acción.",
    escala: [
      { valor: "Alta",  color: "var(--verde)" },
      { valor: "Media", color: "var(--amarillo)" },
      { valor: "Baja",  color: "var(--rojo)" }
    ],
    items: [
      { id: "a", texto: "Capacitación" },
      { id: "b", texto: "Asistencia técnica" },
      { id: "c", texto: "Información científica" },
      { id: "d", texto: "Programas piloto" },
      { id: "e", texto: "Financiamiento para sistemas productivos" },
      { id: "f", texto: "Financiamiento para certificación" },
      { id: "g", texto: "Sistemas de medición" },
      { id: "h", texto: "Articulación con mercados" },
      { id: "i", texto: "Generación de normativa" }
    ]
  },
  {
    id: "p5",
    tipo: "texto",
    texto: "¿Qué mensaje, propuesta o inquietud le gustaría transmitir al Gobierno de La Pampa sobre esta temática?",
    limite: 400
  }
];

/* ═══════════════════════════════════════════════════════════════
   3. Acceso a datos
   ═══════════════════════════════════════════════════════════════ */

const API = SUPABASE_URL + "/rest/v1";
const H = {
  apikey: SUPABASE_ANON,
  Authorization: "Bearer " + SUPABASE_ANON,
  "Content-Type": "application/json"
};

async function leerEstado() {
  try {
    const r = await fetch(API + "/sesion?id=eq.1&select=*", { headers: H });
    if (!r.ok) return null;
    const d = await r.json();
    return d[0] || null;
  } catch { return null; }
}

async function escribirEstado(clave, pregunta, abierta, codigo) {
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/set_estado", {
      method: "POST", headers: H,
      body: JSON.stringify({
        p_clave: clave, p_pregunta: pregunta || null,
        p_abierta: !!abierta, p_codigo: codigo || null
      })
    });
    return r.ok;
  } catch { return false; }
}

async function enviarFilas(filas) {
  try {
    const r = await fetch(
      API + "/respuestas?on_conflict=sesion,pregunta,item,participante",
      { method: "POST", headers: { ...H, Prefer: "resolution=merge-duplicates" },
        body: JSON.stringify(filas) }
    );
    return r.ok;
  } catch { return false; }
}

async function traerNuevas(sesion, desdeId) {
  try {
    const url = API + "/respuestas?sesion=eq." + encodeURIComponent(sesion) +
      "&id=gt." + desdeId + "&select=*&order=id.asc&limit=3000";
    const r = await fetch(url, { headers: H });
    if (!r.ok) return [];
    return await r.json();
  } catch { return []; }
}

/* ═══════════════════════════════════════════════════════════════
   4. Utilidades
   ═══════════════════════════════════════════════════════════════ */

const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const preguntaPorId = id => PREGUNTAS.find(q => q.id === id) || null;

function idParticipante() {
  let v = null;
  try { v = localStorage.getItem("pdep_pid"); } catch {}
  if (!v) {
    v = Math.random().toString(36).slice(2, 11) + Date.now().toString(36).slice(-4);
    try { localStorage.setItem("pdep_pid", v); } catch {}
  }
  return v;
}
const PID = idParticipante();

const VACIAS = new Set(("el la los las un una unos unas de del al a y e o u en con por para que se su sus lo le "+
  "les es son ser esta este estos estas más muy no si sí como pero mi tu nos ya hay lo cual sobre entre").split(" "));

function contarPalabras(valores) {
  const m = new Map();
  valores.forEach(v => String(v)
    .split(/[,;/\n]+/)
    .flatMap(t => t.trim().split(/\s+/))
    .map(w => w.toLowerCase().replace(/[.,;:!¡?¿"'()·]/g, "").trim())
    .filter(w => w.length > 2 && !VACIAS.has(w))
    .forEach(w => m.set(w, (m.get(w) || 0) + 1)));
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 45);
}

function tira(n, max) {
  max = max || 130;
  if (!n) return '<span class="pulso" style="font-family:var(--mono);font-size:13px;color:var(--tenue)">esperando respuestas…</span>';
  let h = "";
  for (let i = 0; i < Math.min(n, max); i++) h += '<span class="cuadro"></span>';
  if (n > max) h += '<span style="font-family:var(--mono);font-size:13px;color:var(--senal);margin-left:6px">+' + (n - max) + '</span>';
  return h;
}

/* ═══════════════════════════════════════════════════════════════
   5. Vista del participante
   ═══════════════════════════════════════════════════════════════ */

const app = $("#app");
let estado = null, enviadas = {}, borrador = {}, cargando = true;

function pintarParticipante() {
  if (cargando) {
    app.innerHTML = '<div class="centrado"><span class="pulso" style="font-family:var(--mono);font-size:14px;color:var(--tenue)">conectando…</span></div>';
    return;
  }
  const q = estado && estado.abierta ? preguntaPorId(estado.pregunta_activa) : null;

  if (!q) {
    app.innerHTML = `<div class="centrado">
      <div style="display:flex;gap:6px;margin-bottom:22px">
        <span class="cuadro pulso"></span><span class="cuadro pulso" style="animation-delay:.3s"></span><span class="cuadro pulso" style="animation-delay:.6s"></span>
      </div>
      <h2 style="font-family:var(--display);font-weight:800;font-size:29px;margin:0 0 10px">Ya estás dentro</h2>
      <p style="color:var(--tenue);font-size:16px;max-width:330px;line-height:1.5;margin:0">
        Dejá esta pantalla abierta. La pregunta va a aparecer acá cuando el presentador la habilite.</p></div>`;
    return;
  }

  if (enviadas[q.id]) {
    app.innerHTML = `<div class="centrado">
      <div class="cuadro" style="width:44px;height:44px;border-radius:7px;margin-bottom:20px"></div>
      <h2 style="font-family:var(--display);font-weight:800;font-size:27px;margin:0 0 10px">Respuesta registrada</h2>
      <p style="color:var(--tenue);font-size:15px;max-width:330px;line-height:1.5;margin:0">
        Mirá la pantalla grande. Cuando cambie la pregunta, esta vista se actualiza sola.</p></div>`;
    return;
  }

  const n = PREGUNTAS.findIndex(x => x.id === q.id) + 1;
  let cuerpo = "";

  if (q.tipo === "opcion") {
    cuerpo = q.opciones.map(o =>
      `<button class="opcion" data-op="${esc(o.letra)}">
         <span class="letra">${esc(o.letra)}</span><span>${esc(o.texto)}</span></button>`).join("");
  }

  if (q.tipo === "semaforo") {
    const sel = borrador[q.id] || {};
    cuerpo = q.items.map(it => `
      <div class="item-fila">
        <div class="item-txt">${esc(it.texto)}</div>
        <div class="semaforo">
          ${q.escala.map(e => `
            <button class="sem-btn" data-item="${esc(it.id)}" data-val="${esc(e.valor)}"
              aria-pressed="${sel[it.id] === e.valor}"
              style="${sel[it.id] === e.valor ? 'box-shadow:inset 0 0 0 2px ' + e.color : ''}">
              <span class="punto" style="background:${e.color}"></span>${esc(e.valor)}
            </button>`).join("")}
        </div>
      </div>`).join("");
    const listos = Object.keys(sel).length, total = q.items.length;
    cuerpo += `<div class="barra-fija">
      <div class="contador" style="text-align:left;margin-bottom:8px">${listos} de ${total} completados</div>
      <button class="btn btn-ancho" id="enviar" ${listos < total ? "disabled" : ""}>Enviar respuestas</button></div>`;
  }

  if (q.tipo === "nube") {
    const v = borrador[q.id] || "";
    cuerpo = `<input type="text" class="escritura" id="txt" maxlength="${q.limite}"
        autocomplete="off" autocapitalize="none" spellcheck="false"
        placeholder="Ej: financiamiento" value="${esc(v)}"
        style="text-align:center;font-size:22px;font-weight:600">
      <div class="contador"><span id="cnt">${v.length}</span>/${q.limite}</div>
      <button class="btn btn-ancho" id="enviar" ${v.trim() ? "" : "disabled"}>Enviar respuesta</button>`;
  }

  if (q.tipo === "texto") {
    const v = borrador[q.id] || "";
    cuerpo = `<textarea class="escritura" id="txt" rows="6" maxlength="${q.limite}"
        placeholder="Escriba su respuesta">${esc(v)}</textarea>
      <div class="contador"><span id="cnt">${v.length}</span>/${q.limite}</div>
      <button class="btn btn-ancho" id="enviar" ${v.trim() ? "" : "disabled"}>Enviar respuesta</button>`;
  }

  app.innerHTML = `<div class="envoltorio">
    <div class="etiqueta">Pregunta ${n} de ${PREGUNTAS.length}</div>
    ${q.titulo ? `<div style="font-family:var(--mono);font-size:12px;color:var(--senal);letter-spacing:.1em;text-transform:uppercase;margin-top:12px">${esc(q.titulo)}</div>` : ""}
    <h2 class="pregunta">${esc(q.texto)}</h2>
    ${q.ayuda ? `<p class="ayuda">${esc(q.ayuda)}</p>` : ""}
    ${cuerpo}
    <div id="aviso"></div></div>`;

  // eventos
  app.querySelectorAll(".opcion").forEach(b =>
    b.onclick = () => mandar(q, [{ item: "", valor: b.dataset.op }]));

  app.querySelectorAll(".sem-btn").forEach(b => b.onclick = () => {
    borrador[q.id] = borrador[q.id] || {};
    borrador[q.id][b.dataset.item] = b.dataset.val;
    pintarParticipante();
  });

  const txt = $("#txt");
  if (txt) {
    txt.oninput = () => {
      if (q.tipo === "nube") {
        // una sola palabra: se descartan espacios, comas y signos
        const limpio = txt.value.replace(/[^\p{L}\p{M}\-]/gu, "");
        if (limpio !== txt.value) txt.value = limpio;
      }
      borrador[q.id] = txt.value;
      $("#cnt").textContent = txt.value.length;
      $("#enviar").disabled = !txt.value.trim();
    };
    if (q.tipo === "nube") txt.onkeydown = e => {
      if (e.key === "Enter" && txt.value.trim()) $("#enviar").click();
    };
  }

  const btn = $("#enviar");
  if (btn) btn.onclick = () => {
    if (q.tipo === "semaforo") {
      const sel = borrador[q.id] || {};
      mandar(q, q.items.map(it => ({ item: it.id, valor: sel[it.id] })));
    } else {
      mandar(q, [{ item: "", valor: (borrador[q.id] || "").trim() }]);
    }
  };
}

async function mandar(q, partes) {
  const btn = $("#enviar");
  if (btn) { btn.disabled = true; btn.textContent = "Enviando…"; }
  const filas = partes.filter(p => p.valor).map(p => ({
    sesion: estado.codigo, pregunta: q.id, item: p.item || "",
    valor: p.valor, participante: PID
  }));
  const ok = await enviarFilas(filas);
  if (ok) { enviadas[q.id] = true; delete borrador[q.id]; pintarParticipante(); }
  else {
    if (btn) { btn.disabled = false; btn.textContent = "Reintentar"; }
    const a = $("#aviso");
    if (a) a.innerHTML = '<div class="aviso">No se pudo guardar. Revisá la conexión y tocá Reintentar.</div>';
  }
}

/* ═══════════════════════════════════════════════════════════════
   6. Vista del presentador
   ═══════════════════════════════════════════════════════════════ */

let clave = "", filas = [], ultimoId = 0, consolaAbierta = true, mostrar = true;

function agregados(qid) {
  const q = preguntaPorId(qid);
  const f = filas.filter(r => r.pregunta === qid);
  if (!q) return { f, personas: 0 };
  const personas = new Set(f.map(r => r.participante)).size;
  return { f, personas };
}

function pintarResultados(q) {
  const { f } = agregados(q.id);

  if (q.tipo === "opcion") {
    const total = new Set(f.map(r => r.participante)).size || 1;
    const conteo = q.opciones.map(o => ({ o, n: f.filter(r => r.valor === o.letra).length }));
    const tope = Math.max(...conteo.map(c => c.n), 1);
    return conteo.map(({ o, n }) => `
      <div class="fila-barra">
        <div class="fila-cab">
          <span class="fila-txt"><b style="color:var(--senal);font-family:var(--mono)">${o.letra}</b> · ${esc(o.texto)}</span>
          <span class="fila-num">${Math.round(n / total * 100)}% (${n})</span>
        </div>
        <div class="pista"><div class="relleno ${n === tope && n ? "lider" : ""}" style="width:${n / tope * 100}%"></div></div>
      </div>`).join("");
  }

  if (q.tipo === "semaforo") {
    const leyenda = `<div class="leyenda">${q.escala.map(e =>
      `<span><i style="background:${e.color}"></i>${esc(e.valor)}</span>`).join("")}</div>`;
    const cuerpo = q.items.map(it => {
      const g = f.filter(r => r.item === it.id);
      const t = g.length || 1;
      const segs = q.escala.map(e => {
        const n = g.filter(r => r.valor === e.valor).length;
        return { n, pct: n / t * 100, color: e.color };
      });
      return `<div class="fila-barra">
        <div class="fila-cab"><span class="fila-txt">${esc(it.texto)}</span></div>
        <div class="pista" style="height:28px">
          ${segs.filter(s => s.n).map(s =>
            `<div class="relleno seg" style="width:${s.pct}%;background:${s.color}"
              >${s.pct >= 8 ? Math.round(s.pct) + "%" : ""}</div>`).join("")}
        </div></div>`;
    }).join("");
    return leyenda + cuerpo;
  }

  if (q.tipo === "nube") {
    const pal = contarPalabras(f.map(r => r.valor));
    if (!pal.length) return "";
    const tope = pal[0][1];
    const [lider, nLider] = pal[0];

    // el resto se reparte arriba y abajo, con las más votadas cerca del centro
    const arriba = [], abajo = [];
    pal.slice(1).forEach((p, i) => (i % 2 ? abajo : arriba).push(p));
    arriba.reverse();

    const chico = ([w, n]) => {
      const k = Math.sqrt(n / tope);
      return `<span style="font-size:${Math.round(15 + k * 34)}px;font-weight:${k > .7 ? 800 : 500};
        color:${k > .6 ? "var(--tinta)" : "var(--aire)"};opacity:${(.45 + k * .55).toFixed(2)}"
        title="${n}">${esc(w)}</span>`;
    };

    return `<div class="nube-centro">
      <div class="nube">${arriba.map(chico).join("")}</div>
      <div class="nube-lider">
        <span>${esc(lider)}</span>
        <div class="nube-cnt">${nLider} ${nLider === 1 ? "mención" : "menciones"}</div>
      </div>
      <div class="nube">${abajo.map(chico).join("")}</div>
    </div>`;
  }

  const lista = f.slice().reverse().slice(0, 60);
  return '<div class="tarjetas">' + lista.map((r, i) =>
    `<div class="tarjeta ${i === 0 ? "nueva" : ""}">${esc(r.valor)}</div>`).join("") + "</div>";
}

function pintarPresentador() {
  if (!estado) {
    app.innerHTML = '<div class="centrado"><span class="pulso" style="font-family:var(--mono);color:var(--tenue)">conectando…</span></div>';
    return;
  }
  const q = preguntaPorId(estado.pregunta_activa);
  const { personas } = q ? agregados(q.id) : { personas: 0 };

  const escena = q ? `
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="etiqueta" style="color:${estado.abierta ? "var(--senal)" : "var(--tenue)"}">
        ${estado.abierta ? "● Recibiendo respuestas" : "○ Votación cerrada"}</div>
      <span style="font-family:var(--mono);font-size:13px;color:var(--tenue)">sesión ${esc(estado.codigo)}</span>
    </div>
    ${q.titulo ? `<div class="etiqueta" style="color:var(--senal);margin-top:16px">${esc(q.titulo)}</div>` : ""}
    <h1 class="titulo-grande">${esc(q.texto)}</h1>
    <div class="resultados">${mostrar ? pintarResultados(q) : `
      <div class="tapado">
        <div class="marco"><b></b></div>
        <h3>Resultados ocultos</h3>
        <p>Las respuestas se siguen recibiendo. Se muestran cuando el presentador las habilite.</p>
      </div>`}</div>
    <div style="margin-top:18px">
      <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:9px">
        <span style="font-family:var(--display);font-weight:800;font-size:32px">${personas}</span>
        <span class="etiqueta">personas respondieron</span></div>
      <div class="tira">${tira(personas)}</div>
    </div>` : `
    <div style="flex:1;display:grid;place-items:center;text-align:center">
      <div><h1 style="font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,60px);margin:0 0 14px;letter-spacing:-.025em">
        Sesión ${esc(estado.codigo)}</h1>
        <p style="color:var(--tenue);font-size:18px;max-width:470px;line-height:1.5">
          Compartí el link con el público y elegí abajo la primera pregunta.</p></div></div>`;

  app.innerHTML = `<div class="escena">
    <div class="escena-cuerpo">${escena}</div>
    <div class="consola">
      <button id="toggle" style="width:100%;background:transparent;padding:9px 0"
        class="etiqueta">${consolaAbierta ? "▾ ocultar consola" : "▴ mostrar consola"}</button>
      <div class="consola-int ${consolaAbierta ? "" : "oculto"}">
        <div class="tabs">${PREGUNTAS.map((x, i) => {
          const n = new Set(filas.filter(r => r.pregunta === x.id).map(r => r.participante)).size;
          return `<button class="tab ${x.id === estado.pregunta_activa ? "activo" : ""}" data-q="${x.id}">
            <span class="cnt">${i + 1}</span><span class="nom">${esc(x.texto)}</span>
            ${n ? `<span class="cnt">${n}</span>` : ""}</button>`;
        }).join("")}</div>
        <div class="acciones">
          <button class="btn ${estado.abierta ? "btn-f" : ""}" id="toggleVoto" ${estado.pregunta_activa ? "" : "disabled"}>
            ${estado.abierta ? "Cerrar votación" : "Abrir votación"}</button>
          <button class="btn ${mostrar ? "btn-f" : ""}" id="verRes" ${estado.pregunta_activa ? "" : "disabled"}>
            ${mostrar ? "Ocultar resultados" : "Mostrar resultados"}</button>
          <button class="btn btn-f" id="csv" ${filas.length ? "" : "disabled"}>Descargar CSV (${filas.length})</button>
          <div style="flex:1"></div>
          <button class="btn btn-r" id="nueva">Nueva sesión</button>
        </div>
      </div></div></div>`;

  $("#toggle").onclick = () => { consolaAbierta = !consolaAbierta; pintarPresentador(); };
  app.querySelectorAll(".tab").forEach(b => b.onclick = async () => {
    await escribirEstado(clave, b.dataset.q, true, null);
    estado = await leerEstado(); pintarPresentador();
  });
  $("#toggleVoto").onclick = async () => {
    await escribirEstado(clave, estado.pregunta_activa, !estado.abierta, null);
    estado = await leerEstado(); pintarPresentador();
  };
  $("#verRes").onclick = () => { mostrar = !mostrar; pintarPresentador(); };
  $("#csv").onclick = descargarCSV;
  $("#nueva").onclick = async () => {
    if (!confirm("Se inicia una sesión nueva y la pantalla queda en blanco.\n\n¿Ya descargaste el CSV de esta sesión?")) return;
    const cod = "S" + new Date().toISOString().slice(2, 16).replace(/[-:T]/g, "");
    await escribirEstado(clave, null, false, cod);
    filas = []; ultimoId = 0;
    estado = await leerEstado(); pintarPresentador();
  };
}

function descargarCSV() {
  const c = s => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const out = [["sesion","pregunta_id","pregunta","tipo","item_id","item","respuesta","participante","fecha_hora"].join(";")];
  filas.forEach(r => {
    const q = preguntaPorId(r.pregunta);
    const it = q && q.items ? q.items.find(i => i.id === r.item) : null;
    out.push([c(r.sesion), c(r.pregunta), c(q ? q.texto : ""), c(q ? q.tipo : ""),
      c(r.item), c(it ? it.texto : ""), c(r.valor), c(r.participante),
      c(new Date(r.creado).toISOString())].join(";"));
  });
  const blob = new Blob(["\uFEFF" + out.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "respuestas-" + (estado ? estado.codigo : "sesion") + ".csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function pedirClave() {
  app.innerHTML = `<div class="centrado"><div style="width:100%;max-width:310px">
    <div class="etiqueta">Acceso del presentador</div>
    <input type="password" id="clave" placeholder="Clave" style="width:100%;margin-top:12px;
      background:var(--sup);color:var(--tinta);font-family:var(--mono);font-size:20px;
      letter-spacing:.2em;text-align:center;padding:15px;border-radius:10px;border:1px solid var(--borde)">
    <div id="err" style="font-size:13px;color:var(--alerta);margin-top:8px;min-height:18px"></div>
    <button class="btn btn-ancho" id="entrar" style="margin-top:8px">Entrar</button>
  </div></div>`;
  const probar = async () => {
    const v = $("#clave").value;
    if (!v) return;
    $("#entrar").disabled = true;
    const est = await leerEstado();
    const ok = est && await escribirEstado(v, est.pregunta_activa, est.abierta, null);
    $("#entrar").disabled = false;
    if (!ok) { $("#err").textContent = "Clave incorrecta o sin conexión."; return; }
    clave = v; estado = est;
    pintarPresentador(); cicloPresentador();
  };
  $("#entrar").onclick = probar;
  $("#clave").onkeydown = e => { if (e.key === "Enter") probar(); };
  $("#clave").focus();
}

/* ═══════════════════════════════════════════════════════════════
   7. Ciclos y arranque
   ═══════════════════════════════════════════════════════════════ */

async function cicloPresentador() {
  document.addEventListener("keydown", e => {
    if (e.key === "o" || e.key === "O") { mostrar = !mostrar; pintarPresentador(); }
  });
  const tick = async () => {
    const nuevas = await traerNuevas(estado.codigo, ultimoId);
    if (nuevas.length) {
      ultimoId = nuevas[nuevas.length - 1].id;
      filas = filas.concat(nuevas);
      pintarPresentador();
    }
  };
  await tick();
  setInterval(tick, 3000);
}

async function cicloParticipante() {
  const tick = async () => {
    const previo = estado ? estado.pregunta_activa + "|" + estado.abierta + "|" + estado.codigo : "";
    estado = await leerEstado();
    cargando = false;
    const ahora = estado ? estado.pregunta_activa + "|" + estado.abierta + "|" + estado.codigo : "";
    if (previo !== ahora) pintarParticipante();
  };
  pintarParticipante();
  await tick();
  pintarParticipante();
  setInterval(tick, 4000);
}

if (location.hash.replace("#", "").startsWith("presenta")) pedirClave();
else cicloParticipante();
</script>
